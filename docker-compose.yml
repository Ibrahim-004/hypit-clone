services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hypit
      POSTGRES_PASSWORD: hypit
      POSTGRES_DB: hypit
    ports:
      - "5432:5432"
    volumes:
      - hypit-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hypit"]
      interval: 5s
      timeout: 5s
      retries: 10
  app:
    build:
      context: ./server
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://hypit:hypit@db:5432/hypit
      JWT_ACCESS_SECRET: change-me-access
      JWT_REFRESH_SECRET: change-me-refresh
      CLIENT_URL: http://localhost:5173
      PORT: "4000"
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy
volumes:
  hypit-db:
